resources:
  jobs:
    bikeshare_etl:
      name: bikeshare_etl_${bundle.target}
      email_notifications:
        on_failure:
          - green.leek47@gmail.com
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../src/bikeshare_bronze_nb.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              source_bucket: ${var.source_bucket}
              volume_name: ${var.volume_name}
              dqx_whl_volume_path: ${var.dqx_whl_volume_path}
              bundle_target: ${bundle.target}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../../src/bikeshare_silver_nb.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              bst_whl_volume_path: ${var.bst_whl_volume_path}
              dqx_whl_volume_path: ${var.dqx_whl_volume_path}

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../../src/bikeshare_gold_nb.py
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              bst_whl_volume_path: ${var.bst_whl_volume_path}
              dqx_whl_volume_path: ${var.dqx_whl_volume_path}
